name: BUILD CHAOS VOTE 1.21.11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Gradle 9.2.0
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.2.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-9.2.0/bin/gradle" --version

      - name: Verify Gradle version
        run: |
          set -euo pipefail
          VERSION="$($RUNNER_TEMP/gradle-9.2.0/bin/gradle --version | awk '/Gradle / {print $2; exit}')"
          test "$VERSION" = "9.2.0"
          echo "Using Gradle $VERSION"

      - name: Build Chaos Vote
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-9.2.0/bin/gradle" clean build --no-daemon --refresh-dependencies

      - name: Show produced jars
        run: ls -lah build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chaos-vote-1.21.11-jar
          path: build/libs/*\.jar
          if-no-files-found: error
