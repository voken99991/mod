name: Build Chaos Vote Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Gradle 9.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.2.0-bin.zip -o /tmp/gradle.zip
          rm -rf /tmp/gradle-9.2.0
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.2.0/bin/gradle --version

      - name: Build mod with Gradle 9.2.0
        shell: bash
        run: /tmp/gradle-9.2.0/bin/gradle build --no-daemon --refresh-dependencies

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: chaos-vote-jar
          path: build/libs/chaos-vote-1.0.0.jar
